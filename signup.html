<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Reality Kisumu Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Main Design System CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('images/p.webp');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn btn-outline-light btn-sm position-absolute top-0 start-0 m-4 fw-semibold">
        ← Back to Home
    </a>

    <div class="auth-card">
        <div class="text-center mb-4">
            <span class="fs-1">🏠</span>
            <h3 class="fw-bold mt-2 mb-1">Create Account</h3>
            <p class="text-muted small">Join Reality Kisumu Hub today</p>
        </div>

        <form id="signupForm" onsubmit="event.preventDefault(); handleSignup();">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Full Name</label>
                <input type="text" class="form-control py-2" required placeholder="John Doe">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Email Address</label>
                <input type="email" class="form-control py-2" required placeholder="john@example.com">
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Password</label>
                <div class="input-group">
                    <input type="password" id="signupPassword" class="form-control py-2" required placeholder="Create a password">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('signupPassword')">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-gold w-100 fw-bold py-2 fs-6 mb-3">
                Register Account ➔
            </button>
        </form>

        <div class="text-center small text-muted">
            Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Log In</a>
        </div>
    </div>

    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function handleSignup() {
            alert("Account registered successfully! Redirecting to houses...");
            window.location.href = "house.html";
        }
    </script>
</body>
</html>
