<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Create Account | Reality Kisumu Hub</title>
    <meta name="description" content="Create a Reality Kisumu Hub account to save listings and arrange property viewings.">
    <meta name="theme-color" content="#10454f">

    <link rel="icon" type="image/png" href="images/favicon-32.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="auth-page">

<a href="index.html" class="auth-back">
    <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to home
</a>

<main class="auth-card animate-fade-scale">
    <div class="auth-head">
        <div class="auth-logo"><i class="bi bi-water" aria-hidden="true"></i></div>
        <h1>Create your account</h1>
        <p>Save listings and arrange viewings in a few taps</p>
    </div>

    <form id="signupForm" novalidate>
        <div class="field">
            <label for="signupName">Full name</label>
            <input type="text" id="signupName" name="name" required
                   placeholder="Jane Achieng" autocomplete="name"
                   aria-describedby="signupNameError">
            <p class="field-error" id="signupNameError">
                <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                <span></span>
            </p>
        </div>

        <div class="field">
            <label for="signupEmail">Email address</label>
            <input type="email" id="signupEmail" name="email" required
                   placeholder="you@example.com" autocomplete="email"
                   aria-describedby="signupEmailError">
            <p class="field-error" id="signupEmailError">
                <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                <span></span>
            </p>
        </div>

        <div class="field">
            <label for="signupPassword">Password</label>
            <div class="field-input-wrap">
                <input type="password" id="signupPassword" name="password" required
                       placeholder="At least 8 characters" autocomplete="new-password"
                       aria-describedby="signupPasswordError">
                <button type="button" class="field-toggle" data-toggle-password="signupPassword"
                        aria-label="Show password">Show</button>
            </div>
            <p class="field-error" id="signupPasswordError">
                <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                <span></span>
            </p>
        </div>

        <button type="submit" class="btn-primary-pill btn-block" id="submitBtn">
            Create account <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
    </form>

    <p class="auth-alt">
        Already have an account? <a href="login.html">Sign in</a>
    </p>
    <p class="auth-alt" style="margin-top:8px">
        <a href="house.html" style="color:var(--text-muted);font-weight:600">Continue browsing without an account</a>
    </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/forms.js"></script>
<script>
(function () {
    'use strict';

    RKForms.bindPasswordToggles();

    var form = document.getElementById('signupForm');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (event) {
        event.preventDefault();

        var name     = document.getElementById('signupName');
        var email    = document.getElementById('signupEmail');
        var password = document.getElementById('signupPassword');

        var ok = RKForms.validate([
            { input: name,     rules: ['required', 'name'] },
            { input: email,    rules: ['required', 'email'] },
            { input: password, rules: ['required', 'minlength:8'] }
        ]);

        if (!ok) {
            var firstBad = form.querySelector('[aria-invalid="true"]');
            if (firstBad) firstBad.focus();
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="bi bi-arrow-repeat spin" aria-hidden="true"></i> Creating account…';

        AuthHub.setCurrentUser({
            fullName: name.value.trim(),
            email: email.value.trim()
        });

        RK.toast('Account created — welcome!', 'success');
        window.setTimeout(function () { window.location.href = 'house.html'; }, 500);
    });
})();
</script>
</body>
</html>
