<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In | Reality Kisumu Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5B93D3">
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            background-color: var(--bg-app);
            background-image: radial-gradient(circle at 15% 20%, rgba(91, 147, 211, 0.12) 0%, transparent 40%),
                              radial-gradient(circle at 85% 80%, rgba(91, 147, 211, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-card-clean {
            background: #ffffff;
            border-radius: var(--radius-xl);
            box-shadow: 0 16px 48px rgba(30, 41, 59, 0.08);
            border: 1px solid #edf1f5;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
        }
        .form-control-custom {
            border-radius: var(--radius-pill);
            padding: 0.75rem 1.25rem;
            border: 1px solid #e2e8f0;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-control-custom:focus {
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 3px rgba(91, 147, 211, 0.18);
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn btn-sm rounded-pill px-3 py-2 fw-bold position-absolute top-0 start-0 m-4 d-inline-flex align-items-center gap-2" style="background:#ffffff;color:var(--text-dark);box-shadow:0 4px 14px rgba(0,0,0,0.06);border:1px solid #e2e8f0">
        <i class="bi bi-arrow-left"></i> Back to Home
    </a>

    <div class="auth-card-clean animate-fade-scale">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="background:var(--blue-soft)">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--blue-primary)" stroke-width="2.5">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>
            <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to access your saved properties and preferences</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark ms-2">Email Address or Username</label>
                <input type="text" class="form-control form-control-custom" required placeholder="user@kisumuhub.com">
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-dark ms-2">Password</label>
                <div class="position-relative">
                    <input type="password" id="loginPassword" class="form-control form-control-custom pe-5" required placeholder="Enter password">
                    <button class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y me-2 text-decoration-none small fw-bold" type="button" onclick="togglePassword('loginPassword')">Show</button>
                </div>
            </div>

            <button type="submit" class="landing-cta-btn w-100 py-3 mb-3">
                Sign In &rarr;
            </button>
        </form>

        <div class="text-center small text-muted">
            Don't have an account? <a href="signup.html" class="fw-bold text-decoration-none" style="color:var(--blue-primary)">Create Account</a>
        </div>
    </div>

    <script src="assets/js/pwa.js"></script>
    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const btn = event.currentTarget;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        function handleLogin() {
            window.location.href = "house.html";
        }
    </script>
</body>
</html>
