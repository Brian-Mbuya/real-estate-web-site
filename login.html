<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sign In | Reality Kisumu Hub</title>
    <meta name="description" content="Sign in to Reality Kisumu Hub to keep track of your saved property listings.">
    <meta name="theme-color" content="#10454f">

    <link rel="icon" type="image/png" href="images/favicon-32.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="auth-page">

<a href="index.html" class="auth-back">
    <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to home
</a>

<main class="auth-card animate-fade-scale">
    <div class="auth-head">
        <div class="auth-logo"><i class="bi bi-water" aria-hidden="true"></i></div>
        <h1>Welcome back</h1>
        <p>Sign in to keep track of the properties you save</p>
    </div>

    <form id="loginForm" novalidate>
        <div class="field">
            <label for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" name="email" required
                   placeholder="you@example.com" autocomplete="email"
                   aria-describedby="loginEmailError">
            <p class="field-error" id="loginEmailError">
                <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                <span></span>
            </p>
        </div>

        <div class="field">
            <label for="loginPassword">Password</label>
            <div class="field-input-wrap">
                <input type="password" id="loginPassword" name="password" required
                       placeholder="Enter your password" autocomplete="current-password"
                       aria-describedby="loginPasswordError">
                <button type="button" class="field-toggle" data-toggle-password="loginPassword"
                        aria-label="Show password">Show</button>
            </div>
            <p class="field-error" id="loginPasswordError">
                <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                <span></span>
            </p>
        </div>

        <button type="submit" class="btn-primary-pill btn-block" id="submitBtn">
            Sign in <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
    </form>

    <p class="auth-alt">
        Don&rsquo;t have an account? <a href="signup.html">Create one</a>
    </p>
    <p class="auth-alt" style="margin-top:8px">
        <a href="house.html" style="color:var(--text-muted);font-weight:600">Continue browsing without an account</a>
    </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/forms.js"></script>
<script>
(function () {
    'use strict';

    RKForms.bindPasswordToggles();

    var form = document.getElementById('loginForm');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (event) {
        event.preventDefault();

        var email = document.getElementById('loginEmail');
        var password = document.getElementById('loginPassword');

        var ok = RKForms.validate([
            { input: email,    rules: ['required', 'email'] },
            { input: password, rules: ['required', 'minlength:6'] }
        ]);

        if (!ok) {
            // Move focus to the first problem so keyboard and screen
            // reader users are told what went wrong.
            var firstBad = form.querySelector('[aria-invalid="true"]');
            if (firstBad) firstBad.focus();
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="bi bi-arrow-repeat spin" aria-hidden="true"></i> Signing in…';

        var handle = email.value.split('@')[0];
        AuthHub.setCurrentUser({
            fullName: handle.charAt(0).toUpperCase() + handle.slice(1),
            email: email.value.trim()
        });

        RK.toast('Signed in successfully', 'success');
        window.setTimeout(function () { window.location.href = 'house.html'; }, 500);
    });
})();
</script>
</body>
</html>
