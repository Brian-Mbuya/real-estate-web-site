        function updatePriceSlider(val) {
            const display = document.getElementById('maxPriceDisplay');
            const hidden = document.getElementById('maxPrice');
            if (!val || val == "300000000") {
                display.innerText = "No Limit";
                hidden.value = "";
            } else {
                display.innerText = "KSh " + parseInt(val).toLocaleString();
                hidden.value = val;
            }
            filterHouses();
        }

        function calculateSmartScore(house, filters) {
            let score = 0;
            let activeFiltersCount = 0;

            if (filters.category && filters.category !== "Favorite") {
                activeFiltersCount++;
                if (house.category.toLowerCase() === filters.category.toLowerCase()) {
                    score += 35;
                }
            }

            if (filters.location) {
                activeFiltersCount++;
                if (house.location.toLowerCase().includes(filters.location.toLowerCase())) {
                    score += 35;
                }
            }

            if (filters.maxPrice && !isNaN(filters.maxPrice) && filters.maxPrice > 0) {
                activeFiltersCount++;
                const diffRatio = Math.abs(house.price - filters.maxPrice) / filters.maxPrice;
                if (diffRatio <= 0.2) {
                    score += 30;
                } else if (diffRatio <= 0.5) {
                    score += 20;
                } else if (diffRatio <= 1.0) {
                    score += 10;
                }
            }

            if (filters.bedrooms && !isNaN(filters.bedrooms) && filters.bedrooms > 0) {
                activeFiltersCount++;
                if (house.bedrooms >= filters.bedrooms) {
                    score += 10;
                }
            }

            if (filters.bathrooms && !isNaN(filters.bathrooms) && filters.bathrooms > 0) {
                activeFiltersCount++;
                if (house.bathrooms >= filters.bathrooms) {
                    score += 10;
                }
            }

            const percentage = activeFiltersCount > 0 ? Math.min(100, Math.round((score / 120) * 100)) : 0;
            return { score, percentage, activeFiltersCount };
        }

        function renderHouses(list, activeFiltersCount = 0) {
            const container = document.getElementById('housesList');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div class="alert alert-info text-center p-5 rounded-4 fs-5 shadow-sm">No properties found matching your criteria. Try adjusting your preferences!</div>';
                return;
            }

            list.forEach((house, idx) => {
                const allImgs = [house.img, ...(house.gallery || [])];
                const slideshowId = `slideshow-${idx}`;
                const card = document.createElement('div');
                card.className = 'property-card-modern mb-4 position-relative';

                const matchProgressHTML = (activeFiltersCount > 0 && house.smartPercentage !== undefined)
                    ? `
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center small fw-bold mb-1">
                            <span class="text-primary">🌟 Match Relevance Score</span>
                            <span class="text-emerald fw-extrabold">${house.smartPercentage}%</span>
                        </div>
                        <div class="match-progress-bar">
                            <div class="match-progress-fill" style="width: ${house.smartPercentage}%;"></div>
                        </div>
                    </div>
                    `
                    : '';

                card.innerHTML = `
                    <button class="fav-btn-floating" title="Toggle Favorite" data-idx="${idx}">
                        ${house.isFav ? '❤️' : '🤍'}
                    </button>
                    <div class="row g-0">
                        <div class="col-md-5 position-relative bg-secondary-subtle">
                            <img class="property-card-img" id="${slideshowId}-img" src="${allImgs[0]}" alt="${house.title}">
                            <div class="position-absolute top-50 start-0 end-0 translate-middle-y d-flex justify-content-between px-2 pointer-events-none">
                                <button class="btn btn-dark btn-sm rounded-circle opacity-75" onclick="prevSlide('${slideshowId}', ${allImgs.length}); event.stopPropagation();">&#10094;</button>
                                <button class="btn btn-dark btn-sm rounded-circle opacity-75" onclick="nextSlide('${slideshowId}', ${allImgs.length}); event.stopPropagation();">&#10095;</button>
                            </div>
                            <div class="position-absolute bottom-0 start-0 m-3">
                                <span class="badge bg-dark opacity-90">${house.category}</span>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="p-4 d-flex flex-column justify-content-between h-100">
                                <div>
                                    <div class="d-flex justify-content-between align-items-start mb-1">
                                        <h5 class="fw-bold mb-0">${house.title}</h5>
                                    </div>
                                    <div class="text-muted small mb-3">📍 ${house.location}</div>

                                    ${matchProgressHTML}

                                    <div class="d-flex flex-wrap gap-2 mb-3">
                                        <span class="badge-tag">🛏️ ${house.bedrooms || 0} Beds</span>
                                        <span class="badge-tag">🚿 ${house.bathrooms || 0} Baths</span>
                                        ${house.area ? `<span class="badge-tag">📐 ${house.area}</span>` : ''}
                                    </div>

                                    <p class="text-secondary small mb-3">${house.desc}</p>
                                </div>

                                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                    <div>
                                        <div class="small text-muted">Asking Price</div>
                                        <div class="fs-4 fw-extrabold text-primary">KSh ${house.price.toLocaleString()}</div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-outline-primary btn-sm fw-semibold" onclick="openTourModal('${house.title}')">
                                            📅 Book Tour
                                        </button>
                                        <a href="https://wa.me/254746672821?text=${encodeURIComponent('Hi, I am interested in: ' + house.title)}" target="_blank" class="btn btn-success btn-sm fw-semibold">
                                            💬 WhatsApp
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                card.dataset.slideshowIdx = "0";
                card.dataset.slideshowImgs = JSON.stringify(allImgs);
                card.dataset.slideshowId = slideshowId;

                const favBtn = card.querySelector('.fav-btn-floating');
                favBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    house.isFav = !house.isFav;
                    let favorites = JSON.parse(localStorage.getItem('favoriteHouses')) || [];
                    if (house.isFav) {
                        if (!favorites.some(h => h.title === house.title && h.location === house.location)) {
                            favorites.push(house);
                        }
                    } else {
                        favorites = favorites.filter(h => !(h.title === house.title && h.location === house.location));
                    }
                    localStorage.setItem('favoriteHouses', JSON.stringify(favorites));
                    filterHouses();
                });

                container.appendChild(card);
            });
        }

        function filterHouses() {
            const category = document.getElementById('category').value;
            const location = document.getElementById('location').value.trim();
            const maxPrice = parseInt(document.getElementById('maxPrice').value);
            const bedrooms = parseInt(document.getElementById('bedrooms').value);
            const bathrooms = parseInt(document.getElementById('bathrooms').value);
            const sortBy = document.getElementById('sortBy').value;

            // Sync localStorage favorites
            const favorites = JSON.parse(localStorage.getItem('favoriteHouses')) || [];
            houses.forEach(h => {
                h.isFav = favorites.some(fav => fav.title === h.title && fav.location === h.location);
            });

            const filters = { category, location, maxPrice, bedrooms, bathrooms };

            let list = houses.filter(h => category === "Favorite" ? h.isFav : true);

            let scoredList = list.map(house => {
                const { score, percentage, activeFiltersCount } = calculateSmartScore(house, filters);
                return { ...house, smartScore: score, smartPercentage: percentage, activeFiltersCount };
            });

            const activeCount = scoredList[0] ? scoredList[0].activeFiltersCount : 0;

            if (sortBy === 'priceAsc') {
                scoredList.sort((a, b) => a.price - b.price);
            } else if (sortBy === 'priceDesc') {
                scoredList.sort((a, b) => b.price - a.price);
            } else if (activeCount > 0) {
                scoredList.sort((a, b) => b.smartScore - a.smartScore);
            }

            renderHouses(scoredList, activeCount);
        }

        function nextSlide(slideshowId, total) {
            const card = Array.from(document.querySelectorAll('.property-card-modern'))
                .find(c => c.dataset.slideshowId === slideshowId);
            if (!card) return;
            let idx = parseInt(card.dataset.slideshowIdx) || 0;
            const imgs = JSON.parse(card.dataset.slideshowImgs);
            idx = (idx + 1) % imgs.length;
            card.dataset.slideshowIdx = idx;
            document.getElementById(`${slideshowId}-img`).src = imgs[idx];
        }

        function prevSlide(slideshowId, total) {
            const card = Array.from(document.querySelectorAll('.property-card-modern'))
                .find(c => c.dataset.slideshowId === slideshowId);
            if (!card) return;
            let idx = parseInt(card.dataset.slideshowIdx) || 0;
            const imgs = JSON.parse(card.dataset.slideshowImgs);
            idx = (idx - 1 + imgs.length) % imgs.length;
            card.dataset.slideshowIdx = idx;
            document.getElementById(`${slideshowId}-img`).src = imgs[idx];
        }

        function openTourModal(title) {
            document.getElementById('tourModalTitle').innerText = "Schedule Tour: " + title;
            const modal = new bootstrap.Modal(document.getElementById('tourModal'));
            modal.show();
        }

        function submitTour() {
            const modalEl = document.getElementById('tourModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();
            alert("Thank you! Your property tour request has been submitted. Our agent will contact you shortly.");
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const category = params.get('category');
            const location = params.get('location');
            const bedrooms = params.get('bedrooms');
            const bathrooms = params.get('bathrooms');
            const maxPrice = params.get('maxprice') || params.get('budget');

            if (category) document.getElementById('category').value = category;
            if (location) document.getElementById('location').value = location;
            if (bedrooms) document.getElementById('bedrooms').value = bedrooms;
            if (bathrooms) document.getElementById('bathrooms').value = bathrooms;
            if (maxPrice) {
                document.getElementById('maxPriceSlider').value = maxPrice;
                updatePriceSlider(maxPrice);
            } else {
                filterHouses();
            }
        });
    </script>
