<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Property Details | Reality Kisumu Hub</title>
    <meta name="description" content="Full details, specifications and direct agent contact for this Kisumu property listing.">
    <meta name="theme-color" content="#10454f">

    <link rel="icon" type="image/png" href="images/favicon-32.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ══ Desktop navbar ══════════════════════════════════ -->
<nav class="app-navbar sticky-top" aria-label="Main">
    <div class="nav-wrap">
        <a class="navbar-brand" href="index.html">
            <i class="bi bi-water brand-mark" aria-hidden="true"></i>
            <span>Reality Kisumu Hub</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" data-nav="index.html">Home</a></li>
            <li><a href="house.html" data-nav="house.html">Explore</a></li>
            <li>
                <a href="liked.html" data-nav="liked.html">
                    Saved <span class="nav-count" data-fav-count hidden>0</span>
                </a>
            </li>
        </ul>
        <div class="nav-auth" data-auth-area></div>
    </div>
</nav>

<div class="page-shell">
    <main id="main">

        <!-- ══ Loading ════════════════════════════════════ -->
        <div id="loadingView" class="page-inner">
            <div class="prop-skeleton" style="border-radius:var(--radius-xl);overflow:hidden;margin-top:20px">
                <div class="skeleton-block" style="aspect-ratio:16/10"></div>
            </div>
            <div style="max-width:820px;margin:22px auto;display:grid;gap:14px">
                <div class="skeleton-line skeleton-line-lg"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line skeleton-line-sm"></div>
                <div class="skeleton-block" style="height:90px;margin-top:12px"></div>
            </div>
        </div>

        <!-- ══ Error ══════════════════════════════════════ -->
        <div id="errorView" class="page-inner" hidden></div>

        <!-- ══ Content ════════════════════════════════════ -->
        <article id="contentView" hidden>
            <div class="detail-hero animate-fade-up">
                <a href="house.html" class="detail-back" id="backBtn" aria-label="Back to listings">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                </a>
                <button type="button" class="detail-fav" id="favBtn" aria-pressed="false" aria-label="Save this property">
                    <i class="bi bi-heart" aria-hidden="true"></i>
                </button>
                <img id="propImage" src="" alt="">
            </div>

            <div class="detail-body animate-fade-up animate-delay-1">
                <span class="detail-eyebrow" id="propType">Property</span>
                <h1 class="detail-title" id="propTitle"></h1>
                <p class="detail-location">
                    <i class="bi bi-geo-alt" aria-hidden="true"></i>
                    <span id="propLocation"></span>
                </p>

                <div class="detail-price-row">
                    <div>
                        <div class="detail-price" id="propPrice"></div>
                        <div class="detail-price-alt" id="propPriceAlt"></div>
                    </div>
                    <div class="currency-toggle" role="group" aria-label="Currency">
                        <button type="button" data-currency="KES" aria-pressed="true">KSh</button>
                        <button type="button" data-currency="USD" aria-pressed="false">USD</button>
                    </div>
                </div>

                <div class="detail-specs" id="propSpecs"></div>

                <h2 class="detail-section-title">About this property</h2>
                <p class="detail-prose" id="propDescription"></p>

                <h2 class="detail-section-title">Listing agent</h2>
                <div class="agent-card">
                    <!-- Brand mark, not a stock photo. images/u.jpg used to sit
                         here and is actually a picture of a house. -->
                    <img src="images/icon-192.png" alt="">
                    <div class="agent-card-info">
                        <strong>Reality Kisumu Hub</strong>
                        <span><i class="bi bi-patch-check-fill" aria-hidden="true"></i> Verified partner</span>
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <a id="btnCall" href="#" class="btn-soft-pill">
                    <i class="bi bi-telephone-fill" aria-hidden="true"></i> Call
                </a>
                <a id="btnWa" href="#" target="_blank" rel="noopener" class="btn-primary-pill" style="background:var(--whatsapp);box-shadow:0 8px 22px rgba(30,185,84,0.3)">
                    <i class="bi bi-whatsapp" aria-hidden="true"></i> WhatsApp
                </a>
            </div>
        </article>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/pwa.js"></script>
<script>
(function () {
    'use strict';

    var loadingView = document.getElementById('loadingView');
    var errorView   = document.getElementById('errorView');
    var contentView = document.getElementById('contentView');
    var favBtn      = document.getElementById('favBtn');

    var property = null;

    function showError(title, body) {
        loadingView.hidden = true;
        contentView.hidden = true;
        errorView.hidden = false;
        // An inline state, not an alert() + forced redirect. The old
        // page yanked you back to the feed before you could read it.
        errorView.innerHTML = RK.stateHTML({
            icon: 'bi-exclamation-triangle',
            title: title,
            body: body,
            actionHref: 'house.html',
            actionLabel: 'Back to listings'
        });
    }

    function specCell(icon, value, label) {
        return '<div class="detail-spec">' +
            '<i class="bi ' + icon + '" aria-hidden="true"></i>' +
            '<strong>' + RK.escapeHtml(value) + '</strong>' +
            '<span>' + RK.escapeHtml(label) + '</span>' +
        '</div>';
    }

    function renderPrices() {
        if (!property) return;
        var usd = RK.getCurrency() === 'USD';
        document.getElementById('propPrice').textContent = RK.formatPrice(property);
        // Always show the other currency underneath for context.
        document.getElementById('propPriceAlt').textContent = usd
            ? 'Approx. KSh ' + property.priceKsh.toLocaleString()
            : 'Approx. $' + property.priceUsd.toLocaleString();
    }

    function syncFav() {
        var isSaved = RK.Favorites.has(property.id);
        favBtn.classList.toggle('is-saved', isSaved);
        favBtn.setAttribute('aria-pressed', isSaved ? 'true' : 'false');
        favBtn.setAttribute('aria-label', (isSaved ? 'Remove ' : 'Save ') + property.title);
        favBtn.querySelector('i').className = 'bi ' + (isSaved ? 'bi-heart-fill' : 'bi-heart');
    }

    function render() {
        document.title = property.title + ' | Reality Kisumu Hub';

        var img = document.getElementById('propImage');
        img.src = property.image;
        img.alt = property.title;
        img.onerror = function () { img.src = RK.PLACEHOLDER_IMG; };

        document.getElementById('propType').textContent = property.type;
        document.getElementById('propTitle').textContent = property.title;
        document.getElementById('propLocation').textContent = property.location;

        renderPrices();

        /* No "Category" cell — the type is already stated in the
           eyebrow badge directly above the title. */
        var specs = '';
        if (property.beds > 0)  specs += specCell('bi-door-open', property.beds, property.beds === 1 ? 'Bedroom' : 'Bedrooms');
        if (property.baths > 0) specs += specCell('bi-droplet', property.baths, property.baths === 1 ? 'Bathroom' : 'Bathrooms');
        if (property.sqft > 0)  specs += specCell('bi-rulers', property.sqft.toLocaleString(), 'Sq ft');

        var specsEl = document.getElementById('propSpecs');
        specsEl.innerHTML = specs;
        specsEl.hidden = specs === '';

        document.getElementById('propDescription').textContent =
            'This ' + property.type.toLowerCase() + ' in ' + property.location +
            ' offers ' + (property.sqft > 0 ? property.sqft.toLocaleString() + ' square feet of ' : '') +
            'well-planned space' +
            (property.beds > 0 ? ' with ' + property.beds + ' bedroom' + (property.beds > 1 ? 's' : '') : '') +
            (property.baths > 0 ? ' and ' + property.baths + ' bathroom' + (property.baths > 1 ? 's' : '') : '') +
            '. Contact the listing agent directly to arrange a viewing or ask about payment terms.';

        // The agent's real number — previously discarded by a
        // precedence bug that always chose the hardcoded fallback.
        document.getElementById('btnCall').href = RK.telLink(property.agentPhone);
        document.getElementById('btnWa').href = RK.whatsappLink(property.agentPhone, property.title);

        syncFav();

        loadingView.hidden = true;
        errorView.hidden = true;
        contentView.hidden = false;
    }

    favBtn.addEventListener('click', function () {
        if (!property) return;
        var nowSaved = RK.Favorites.toggle(property);
        syncFav();
        RK.toast(nowSaved ? 'Saved to your favorites' : 'Removed from favorites', nowSaved ? 'success' : 'info');
    });

    window.addEventListener('rk:currencychange', renderPrices);

    async function load() {
        var id = new URLSearchParams(window.location.search).get('id');

        if (!id) {
            showError('No property selected', 'This link is missing a property reference.');
            return;
        }

        // Works offline for anything already saved.
        var cached = RK.Favorites.all().filter(function (p) { return String(p.id) === String(id); })[0];

        var client = window.SupabaseHub && SupabaseHub.client;
        if (!client) {
            if (cached) { property = cached; render(); return; }
            showError('Cannot reach the listings service', 'Check your connection and try again.');
            return;
        }

        try {
            var res = await client.from('properties').select('*').eq('id', id).single();
            if (res.error) throw res.error;
            if (!res.data) throw new Error('not found');

            property = RK.normalizeProperty(res.data);
            render();
        } catch (err) {
            console.error('Property fetch failed:', err);
            if (cached) {
                property = cached;
                render();
                RK.toast('Showing your saved copy', 'info');
                return;
            }
            showError('Property not available', 'This listing may have been removed, or the link is no longer valid.');
        }
    }

    // Return to the feed the user came from where possible.
    if (document.referrer && document.referrer.indexOf(window.location.host) > -1) {
        document.getElementById('backBtn').addEventListener('click', function (e) {
            e.preventDefault();
            window.history.back();
        });
    }

    load();
})();
</script>
</body>
</html>
