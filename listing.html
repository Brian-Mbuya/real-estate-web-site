<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Search Engine | Reality Kisumu Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b192c">

    <link rel="manifest" href="manifest.json">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Main Design System CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 sticky-top border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <svg class="icon-svg fs-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Reality Kisumu Hub</span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="house.html">Browse Listings</a></li>
                    <li class="nav-item"><a class="nav-link active" href="listing.html">Smart Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="liked.html">Saved Favorites</a></li>
                </ul>
                
                <div class="d-flex align-items-center gap-2">
                    <button id="pwaInstallBtn" class="btn btn-outline-light btn-sm d-none fw-semibold">Install App</button>
                    <a href="login.html" class="btn btn-outline-light btn-sm px-3 fw-semibold">Sign In</a>
                    <a href="signup.html" class="btn btn-amber btn-sm px-3">Create Account</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Banner -->
    <header class="bg-dark text-white py-4 border-bottom border-secondary mb-4">
        <div class="container text-center">
            <h1 class="h2 fw-bold mb-1">Smart Preference Ranking Engine</h1>
            <p class="text-secondary small mb-0">Multi-signal search algorithm evaluating budget proximity, location relevance, and property type.</p>
        </div>
    </header>

    <div class="container mb-5">
        <!-- Search Card -->
        <div class="card border-0 shadow-sm rounded-3 p-4 mb-4">
            <form id="smartSearchForm" onsubmit="event.preventDefault(); runSmartSearch();" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-secondary">Target Budget (KSh)</label>
                    <input type="number" id="budgetInput" class="form-control" placeholder="e.g. 25000000" value="25000000">
                </div>

                <div class="col-md-3">
                    <label class="form-label small fw-bold text-secondary">Preferred Location</label>
                    <input type="text" id="locationInput" class="form-control" placeholder="e.g. Milimani, Riat, Ondiek">
                </div>

                <div class="col-md-3">
                    <label class="form-label small fw-bold text-secondary">Property Type</label>
                    <select id="typeInput" class="form-select">
                        <option value="">Any Type</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Villa">Villa</option>
                        <option value="Bungalow">Bungalow</option>
                        <option value="Land">Land / Plot</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-brand w-100 fw-bold py-2">Calculate Relevance & Rank</button>
                </div>
            </form>
        </div>

        <div class="row g-4" id="smartResultsGrid"></div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5 border-top border-secondary">
        <div class="container text-center small text-secondary">
            &copy; 2026 Reality Kisumu Hub. All rights reserved.
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/pwa.js"></script>
    <script>
        const properties = [
            {
                title: "3 Bed Apartment in Kisumu",
                category: "Apartment",
                location: "Ondiek Highway",
                price: 42000000,
                bedrooms: 3,
                img: "images/p.webp",
                desc: "Anderson Park Residence Kisumu featuring piped gas, swimming pool, gym, and club house."
            },
            {
                title: "1 Bed Apartment with En Suite at Ondiek Highway",
                category: "Apartment",
                location: "Ondiek Highway",
                price: 42000000,
                bedrooms: 1,
                img: "images/p.webp",
                desc: "1 bedroom luxury apartment with en-suite bathroom at Anderson Park Residence."
            },
            {
                title: "2 Bed Apartment with Parking in Kisumu",
                category: "Apartment",
                location: "Nubian Estate",
                price: 23000000,
                bedrooms: 5,
                img: "images/e.jpg",
                desc: "Strategically placed apartment building housing 9 units in Nubian Estate with electric fence."
            },
            {
                title: "Residential Land at Riat",
                category: "Land",
                location: "Riat",
                price: 2000000,
                bedrooms: 0,
                img: "images/c.jpeg",
                desc: "Riat hills plots in Kisumu located 6.5km from Kisumu International Airport with serene views."
            },
            {
                title: "Residential Land at Maseno",
                category: "Land",
                location: "Maseno",
                price: 12000000,
                bedrooms: 0,
                img: "images/u.jpg",
                desc: "1/4 acre plot fronting Siriba Road with 2 residential houses opposite Maseno University."
            },
            {
                title: "5 Bed Villa with Swimming Pool",
                category: "Villa",
                location: "Riat Hills",
                price: 48000000,
                bedrooms: 5,
                img: "images/RiatV.jpeg",
                desc: "Scandinavian-inspired gated community overlooking Lake Victoria in front and Nandi Hills in back."
            },
            {
                title: "4 Bed House in Milimani",
                category: "Bungalow",
                location: "Milimani",
                price: 20000000,
                bedrooms: 4,
                img: "images/milimani/m6.jpg",
                desc: "Prime Milimani estate bungalow featuring tiled floors, garden, and private parking."
            },
            {
                title: "10 Bed Multi-unit in Milimani",
                category: "Multi-unit",
                location: "Milimani",
                price: 300000000,
                bedrooms: 10,
                img: "images/milimani/suite.jpeg",
                desc: "Multi-unit investment property with 3 residential blocks in one acre stone walled plot."
            },
            {
                title: "4 Bed House with Gym at Dairy Farm",
                category: "Bungalow",
                location: "Gem Yala",
                price: 23000000,
                bedrooms: 4,
                img: "images/dairy/3a4873e1-9856-459c-a240-e597e95665e9.webp",
                desc: "Dairy farm with 4 bedroom house, gym, and complete farming infrastructure."
            }
        ];

        function calculateScore(p, budget, location, type) {
            let score = 0;
            if (budget && budget > 0) {
                const diffRatio = Math.abs(p.price - budget) / budget;
                if (diffRatio <= 0.2) score += 40;
                else if (diffRatio <= 0.5) score += 25;
                else if (diffRatio <= 1.0) score += 10;
            }
            if (location && p.location.toLowerCase().includes(location.toLowerCase())) {
                score += 35;
            }
            if (type && p.category.toLowerCase() === type.toLowerCase()) {
                score += 25;
            }
            return Math.min(100, score);
        }

        function runSmartSearch() {
            const budget = parseFloat(document.getElementById('budgetInput').value);
            const location = document.getElementById('locationInput').value.trim();
            const type = document.getElementById('typeInput').value;

            let scored = properties.map(p => {
                const score = calculateScore(p, budget, location, type);
                return { ...p, score };
            });

            scored.sort((a, b) => b.score - a.score);

            const grid = document.getElementById('smartResultsGrid');
            grid.innerHTML = '';

            scored.forEach(p => {
                const col = document.createElement('div');
                col.className = 'col-md-6';
                col.innerHTML = `
                    <div class="card-property p-4 h-100 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="fw-bold mb-0">${p.title}</h5>
                                <span class="badge-relevance">Match Score: ${p.score}/100</span>
                            </div>
                            <div class="fs-4 fw-bold text-dark mb-2">KSh ${p.price.toLocaleString()}</div>
                            <div class="text-secondary small mb-3">
                                📍 <strong>Location:</strong> ${p.location} |
                                <strong>Category:</strong> ${p.category}
                            </div>
                            <p class="text-secondary small mb-3">${p.desc}</p>
                        </div>
                        <div class="pt-3 border-top">
                            <a href="https://wa.me/254746672821?text=${encodeURIComponent('Hi, inquiring about: ' + p.title)}" target="_blank" class="btn btn-success btn-sm fw-semibold w-100">
                                WhatsApp Agent
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        document.addEventListener('DOMContentLoaded', runSmartSearch);
    </script>
</body>
</html>
